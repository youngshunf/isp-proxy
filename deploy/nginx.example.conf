# 反向代理示例（nginx）：用户前台与管理后台的静态文件，以及 /api/、/admin-api/ 转发到 isp-control。
# 域名、证书路径均为占位值。管理后台使用独立子域名（docs/05 F-W2）。
# 节点接口 :8443（mTLS）不经过这里，由节点直连 isp-control。

upstream isp_control {
    server 127.0.0.1:8080;
    keepalive 16;
}

# 公共的安全头与代理设置。
map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

server {
    listen 80;
    listen [::]:80;
    server_name portal.example.com admin.example.com;
    return 301 https://$host$request_uri;
}

# 用户前台：静态文件 + /api/
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.example.com;

    ssl_certificate     /etc/ssl/example/portal.fullchain.pem;
    ssl_certificate_key /etc/ssl/example/portal.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    root /srv/isp/portal;   # web/apps/portal 构建产物
    index index.html;

    location /api/ {
        proxy_pass http://isp_control;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # 只传真实来源，不追加客户端自带的值
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 1m;
    }
    # 用户前台不提供管理接口。
    location /admin-api/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;   # 前端路由
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# 管理后台：静态文件 + /admin-api/
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.example.com;

    ssl_certificate     /etc/ssl/example/admin.fullchain.pem;
    ssl_certificate_key /etc/ssl/example/admin.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # 可选：只允许办公网段访问管理后台。
    # allow 203.0.113.0/24;
    # deny all;

    root /srv/isp/admin;    # web/apps/admin 构建产物
    index index.html;

    location /admin-api/ {
        proxy_pass http://isp_control;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 1m;
    }
    location /api/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
