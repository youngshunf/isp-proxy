openapi: 3.1.0
info:
  title: ISP 代理平台业务 API
  version: 1.0.0-m1
  summary: 用户前台（/api/）与管理后台（/admin-api/）的唯一契约
  description: |
    M1 冻结的对外契约（docs/05 §5、docs/06 §4）。节点内部接口（/agent/v1/*）不在本文件，见 internal/agentproto。

    通用约定：
    - 时间为 RFC 3339（UTC）；流量为字节（十进制 GB）；时长为秒；金额为最小货币单位（分），币种 CNY。
    - 对外 ID 为带前缀的随机串（sub_、ord_、req_、usr_…，100 位随机），不可枚举。访问别人的资源一律返回 404。
    - 会话放在 HttpOnly Cookie：用户 isp_session，管理员 isp_admin，两者互不通用。
    - CSRF 双提交：任何响应在缺少时都会下发非 HttpOnly 的 isp_csrf Cookie；所有非 GET 请求必须带值相同的 X-CSRF-Token 头，
      否则返回 403 forbidden。前端启动时先请求 GET /api/me（或 /admin-api/me）即可拿到该 Cookie。
    - 错误：HTTP 状态 + Error 对象；code 与前端 ApiErrorCode 一致。message 是面向客户的中文说明，前端只展示，不自行推断业务结论。
    - 幂等：创建订单、换接入、换出口申请以及管理端会产生账务或变更副作用的写接口要求 Idempotency-Key 头；
      同一主体同一键重复提交返回首次结果，键相同但请求体不同返回 409 conflict。
    - 可用性永远读服务端字段（blockers、remainingSeconds），前端不依赖本机时钟判断。
servers:
  - url: /
tags:
  - name: account
    description: 用户账号与会话（R-15）
  - name: subscriptions
    description: 我的 IP（R-17、R-04、R-11）
  - name: catalog
    description: 套餐与规则（R-16）
  - name: orders
    description: 订单（R-09、R-16）
  - name: exit-requests
    description: 换出口申请（R-11、R-17）
  - name: admin-auth
    description: 管理员登录与 TOTP（R-15.5、R-15.6、D-15）
  - name: admin-overview
    description: 运营概览（R-12）
  - name: admin-subscriptions
    description: 订阅管理、换接入/换出口、权益调整（R-12）
  - name: admin-upstreams
    description: 上游资源库存（R-03、R-16.3）
  - name: admin-catalog
    description: 套餐、流量包与规则版本
  - name: admin-users
    description: 用户管理
  - name: admin-orders
    description: 订单、人工核款与退款处置
  - name: admin-exit-requests
    description: 换出口申请处理（D-19）
  - name: admin-monitoring
    description: 节点、告警与审计（R-19）

paths:
  # ==========================================================================
  # 用户端：账号与会话
  # ==========================================================================
  /api/me:
    get:
      operationId: session
      tags: [account]
      summary: 当前会话的账号
      description: 已登录返回账号；未登录返回 401（前端映射为 null）。同时确保下发 isp_csrf Cookie。
      security: [{}, {userSession: []}]
      responses:
        '200':
          description: 当前账号
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/sessions:
    post:
      operationId: login
      tags: [account]
      summary: 邮箱密码登录
      description: |
        成功时设置 isp_session。邮箱或密码错误统一返回 422 invalid（不区分哪一项错）；按邮箱与来源 IP 分别限流。
        封禁账号也可以登录查看（account.status = banned，订阅阻断原因含 account_banned），但所有写操作返回 412。
      security: [{}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginInput'}
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/sessions/current:
    delete:
      operationId: logout
      tags: [account]
      summary: 退出登录（撤销当前会话）
      security: [{userSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': {description: 已退出}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/account/register:
    post:
      operationId: register
      tags: [account]
      summary: 注册
      description: |
        为不泄露邮箱是否已注册（R-15.3），对任何格式正确的邮箱都返回 201 和相同的响应体，且不建立会话；
        新邮箱收到验证码，已注册邮箱收到“该邮箱已有账号”的提醒邮件。随后用 verify-email（带 email）完成验证并登录。
      security: [{}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterInput'}
      responses:
        '201':
          description: 已受理
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegisterResult'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/account/verify-email:
    post:
      operationId: verifyEmail
      tags: [account]
      summary: 用邮件验证码完成邮箱验证
      description: |
        已登录（未验证）时可只传 code；未登录时必须同时传 email，验证成功即建立会话。
        验证码 6 位、15 分钟有效、最多 5 次尝试、一次性、用途绑定（D-15）。错误、过期、超次统一返回 422。
      security: [{}, {userSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerifyEmailInput'}
      responses:
        '200':
          description: 已验证，返回账号
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/account/resend-verification:
    post:
      operationId: resendVerification
      tags: [account]
      summary: 重发验证码
      description: 重发后旧验证码立即失效。已登录时发给本人邮箱；未登录时需传 email，结果一律 204（不泄露是否注册）。同一邮箱 60 秒一次、每小时 5 次。
      security: [{}, {userSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailOnlyInput'}
      responses:
        '204': {description: 已受理}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/account/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [account]
      summary: 申请找回密码
      description: 结果一律 204，不泄露邮箱是否注册；已注册邮箱收到一次性验证码。
      security: [{}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequiredInput'}
      responses:
        '204': {description: 已受理}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/account/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [account]
      summary: 用验证码设置新密码
      description: |
        成功后撤销该账号全部会话（R-15.4），需要重新登录。管理员代建的用户也用本接口首次设置密码，成功同时视为邮箱已验证。
        原型 PortalApi 尚无此方法，F-W4 转正时补上。
      security: [{}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmPasswordResetInput'}
      responses:
        '204': {description: 已设置}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/account/change-password:
    post:
      operationId: changePassword
      tags: [account]
      summary: 修改登录密码
      description: 成功后撤销该账号其他全部会话，当前会话换发新令牌。登录密码与接入密码互不影响（R-15.7）。
      security: [{userSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordInput'}
      responses:
        '204': {description: 已修改}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ==========================================================================
  # 用户端：我的 IP
  # ==========================================================================
  /api/subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: 我的 IP 列表
      description: 只含本人订阅，不含已删除的订阅。blockers 已按 docs/01 §7.2 排序。
      security: [{userSession: []}]
      responses:
        '200':
          description: 订阅列表
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Subscription'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Unverified'}
  /api/subscriptions/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      operationId: getSubscription
      tags: [subscriptions]
      summary: IP 详情
      security: [{userSession: []}]
      responses:
        '200':
          description: 订阅
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Unverified'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: renameSubscription
      tags: [subscriptions]
      summary: 改名（只允许改名）
      security: [{userSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenameInput'}
      responses:
        '200':
          description: 改名后的订阅
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Unverified'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/Precondition'}
        '422': {$ref: '#/components/responses/Invalid'}
  /api/subscriptions/{subscriptionId}/events:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      operationId: listSubscriptionEvents
      tags: [subscriptions]
      summary: 时长与流量记录、接入/出口变更历史
      description: 合并权益账本与接入/出口版本历史，按时间倒序；不含供应商信息与管理端内部条目。
      security: [{userSession: []}]
      responses:
        '200':
          description: 事件列表（新的在前）
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SubscriptionEvent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Unverified'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/subscriptions/{subscriptionId}/access-changes:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      operationId: changeAccess
      tags: [subscriptions]
      summary: 自助换接入（重置密码 / 更换端口与密码）
      description: |
        前置条件见 R-04.8：生命周期为有效或保留期；用户封禁、管理员暂停时返回 412。每订阅滚动 24 小时 5 次（D-18），
        用完返回 429 quota_exhausted；已有进行中的变更任务返回 409。
        返回新签发的接入（unseenChanges 标出改动字段）；节点应用完成前订阅的 blockers 含 changing。旧接入在新接入生效时立即失效。
      security: [{userSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeAccessInput'}
      responses:
        '200':
          description: 新接入
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Access'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Unverified'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/Precondition'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/subscriptions/{subscriptionId}/access/ack:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      operationId: acknowledgeAccess
      tags: [subscriptions]
      summary: 确认已看到新接入（清空 unseenChanges）
      security: [{userSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': {description: 已确认}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Unverified'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ==========================================================================
  # 用户端：目录与订单
  # ==========================================================================
  /api/catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      summary: 可售套餐、流量包、规则版本与收款说明
      description: 访客可读（R-03 访客）。只含上架套餐；库存只给档位，不暴露具体数量与供应商。
      security: [{}, {userSession: []}]
      responses:
        '200':
          description: 目录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Catalog'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: 我的订单（新的在前）
      security: [{userSession: []}]
      responses:
        '200':
          description: 订单列表
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Order'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Unverified'}
    post:
      operationId: createOrder
      tags: [orders]
      summary: 下单
      description: |
        服务端校验套餐可售、价格版本（传了 planVersionId/packVersionId 而已变化时返回 409）、用户状态与库存。
        新购未付款预留库存 24 小时，每用户同时最多 3 个未付款新购（R-16.4），超出返回 409；无货返回 409。
        续购类订单只能针对本人订阅。一次订单一个订阅（D-13），新购 quantity 只能为 1。
        当前规则版本未配置收款说明时返回 412（docs/06 §8.1）。
      security: [{userSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderInput'}
      responses:
        '201':
          description: 新订单
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Unverified'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/Precondition'}
        '422': {$ref: '#/components/responses/Invalid'}
  /api/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      tags: [orders]
      summary: 订单详情
      security: [{userSession: []}]
      responses:
        '200':
          description: 订单
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Unverified'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/orders/{orderId}/claim-paid:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: claimPaid
      tags: [orders]
      summary: 反馈“已转账”
      description: 只记录 userClaimedPaidAt 作为核对线索，不改变收款状态（R-09.2）。只有待核款订单可用，否则 412。
      security: [{userSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 订单
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Unverified'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/Precondition'}
  /api/orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: cancelOrder
      tags: [orders]
      summary: 取消未付款订单
      description: 只有待核款且未反馈付款的订单可以取消（已反馈付款的请联系客服），否则 412；取消即释放库存预留。
      security: [{userSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 订单
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Unverified'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/Precondition'}

  # ==========================================================================
  # 用户端：换出口申请
  # ==========================================================================
  /api/exit-requests:
    get:
      operationId: listExitRequests
      tags: [exit-requests]
      summary: 我的申请（新的在前）
      description: 不含管理员内部备注、候选资源与供应商信息（R-17）。
      security: [{userSession: []}]
      responses:
        '200':
          description: 申请列表
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ExitRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Unverified'}
    post:
      operationId: createExitRequest
      tags: [exit-requests]
      summary: 申请换出口
      description: |
        同一订阅已有未完成申请时返回 409，响应体 existing 为现有申请（R-17.3）。
        免费次数为每订阅滚动 30 天 1 次（D-19）；超出时 charge = manual，申请进入“待管理员确认收费”，确认前不切换。
        前置条件同 R-04.8，不满足时 412。
      security: [{userSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExitRequestInput'}
      responses:
        '201':
          description: 新申请
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExitRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Unverified'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 已有未完成申请
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExitRequestConflict'}
        '412': {$ref: '#/components/responses/Precondition'}
        '422': {$ref: '#/components/responses/Invalid'}

  # ==========================================================================
  # 管理端：登录与 TOTP
  # ==========================================================================
  /admin-api/sessions:
    post:
      operationId: adminLogin
      tags: [admin-auth]
      summary: 管理员登录第一步（邮箱 + 密码）
      description: |
        成功后设置 isp_admin（尚未完成第二步，只能调用 /admin-api/sessions/current/mfa）。
        已绑定 TOTP 返回 stage = totp_required；首次登录返回 stage = enrollment_required 及待绑定的密钥。
        失败统一 422；按邮箱与来源 IP 限流；失败与成功均审计。
      security: [{}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginInput'}
      responses:
        '200':
          description: 需要第二步
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminLoginChallenge'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin-api/sessions/current/mfa:
    post:
      operationId: adminVerifyMfa
      tags: [admin-auth]
      summary: 管理员登录第二步（TOTP 或恢复码；首次登录即完成绑定）
      description: |
        TOTP：RFC 6238，30 秒，6 位，允许 ±1 步，同一时间步不能重复使用。首次绑定成功时返回 10 个一次性恢复码（只显示这一次）。
        恢复码登录后该码作废。失败 422，连续失败按限流处理。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminMfaInput'}
      responses:
        '200':
          description: 登录完成
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin-api/sessions/current:
    delete:
      operationId: adminLogout
      tags: [admin-auth]
      summary: 管理员退出
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': {description: 已退出}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin-api/me:
    get:
      operationId: adminMe
      tags: [admin-auth]
      summary: 当前管理员
      description: 未登录或第二步未完成返回 401。同时确保下发 isp_csrf Cookie。
      security: [{}, {adminSession: []}]
      responses:
        '200':
          description: 当前管理员
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Admin'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin-api/me/recovery-codes:
    post:
      operationId: adminRegenerateRecoveryCodes
      tags: [admin-auth]
      summary: 重新生成恢复码（旧码全部作废）
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TotpCodeInput'}
      responses:
        '200':
          description: 新恢复码（只显示这一次）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryCodes'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Invalid'}

  # ==========================================================================
  # 管理端：概览
  # ==========================================================================
  /admin-api/overview:
    get:
      operationId: adminGetOverview
      tags: [admin-overview]
      summary: 运营概览
      security: [{adminSession: []}]
      responses:
        '200':
          description: 概览
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Overview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  # ==========================================================================
  # 管理端：订阅
  # ==========================================================================
  /admin-api/subscriptions:
    get:
      operationId: adminListSubscriptions
      tags: [admin-subscriptions]
      summary: 订阅列表（筛选、分页）
      security: [{adminSession: []}]
      parameters:
        - {name: q, in: query, description: 按订阅 ID、名称、用户邮箱、接入用户名或出口 IP 搜索, schema: {type: string}}
        - {name: userId, in: query, schema: {type: string}}
        - {name: nodeId, in: query, schema: {type: string}}
        - name: lifecycle
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: {$ref: '#/components/schemas/AdminLifecycle'}
        - {name: blocker, in: query, description: 含该阻断原因, schema: {$ref: '#/components/schemas/Blocker'}}
        - {name: usable, in: query, description: true 只看可用（blockers 为空）, schema: {type: boolean}}
        - {name: expiresBefore, in: query, schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 一页订阅
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSubscriptionPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
    post:
      operationId: adminCreateSubscription
      tags: [admin-subscriptions]
      summary: 为用户代建订阅并开通（P0a）
      description: |
        走与自助下单相同的订单、收款、入账与审计链路（docs/01 §6.1）：创建新购订单 → 记录收款（人工转账或赠送）→
        入账 → 创建履约任务。指定 resourceId 时用该可售资源，否则按套餐地域自动分配；无库存时订单进入“已收款，交付异常”。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminCreateSubscriptionInput'}
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminCreateSubscriptionResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/Precondition'}
        '422': {$ref: '#/components/responses/Invalid'}
  /admin-api/subscriptions/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      operationId: adminGetSubscription
      tags: [admin-subscriptions]
      summary: 订阅详情
      security: [{adminSession: []}]
      responses:
        '200':
          description: 订阅详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSubscriptionDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: adminRenameSubscription
      tags: [admin-subscriptions]
      summary: 改名
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenameInput'}
      responses:
        '200':
          description: 订阅详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSubscriptionDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /admin-api/subscriptions/{subscriptionId}/pause:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      operationId: adminPauseSubscription
      tags: [admin-subscriptions]
      summary: 暂停（立即拒绝新连接，≤ 1 秒关闭存量连接）
      description: 不顺延期限。已暂停时幂等返回当前状态。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonInput'}
      responses:
        '200':
          description: 订阅详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSubscriptionDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/Precondition'}
  /admin-api/subscriptions/{subscriptionId}/resume:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      operationId: adminResumeSubscription
      tags: [admin-subscriptions]
      summary: 恢复
      description: 只解除管理员暂停；其他阻断（到期、耗尽、封禁）仍然生效（R-10.1）。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 订阅详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSubscriptionDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin-api/subscriptions/{subscriptionId}/deletion:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      operationId: adminDeleteSubscription
      tags: [admin-subscriptions]
      summary: 删除订阅
      description: |
        停止所有入口、撤销凭据、释放资源，保留订单与消费历史（R-10.7）。有剩余流量时必须 acknowledgeRemainingTraffic = true，
        否则 412（不得静默没收）。只允许从“有效”或“已释放”删除。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeleteSubscriptionInput'}
      responses:
        '200':
          description: 订阅详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSubscriptionDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/Precondition'}
  /admin-api/subscriptions/{subscriptionId}/fulfillment:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      operationId: adminRetryFulfillment
      tags: [admin-subscriptions]
      summary: 重试履约（待履约 / 履约异常 / 已释放后续时长）
      description: 可指定资源；重复提交不会生成第二个订阅、接入或重复入账（R-03.5）。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FulfillmentInput'}
      responses:
        '200':
          description: 履约任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/Precondition'}
  /admin-api/subscriptions/{subscriptionId}/access-changes:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      operationId: adminChangeAccess
      tags: [admin-subscriptions]
      summary: 代办换接入 / 重置密码
      description: 不计入用户自助次数；暂停或封禁时仍可操作（R-04.8）。已有进行中任务时 409。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminChangeAccessInput'}
      responses:
        '200':
          description: 变更任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/Precondition'}
  /admin-api/subscriptions/{subscriptionId}/access/reveal:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      operationId: adminRevealAccess
      tags: [admin-subscriptions]
      summary: 查看当前接入明文（审计）
      description: 需要填写原因；记录审计（access.reveal），审计中不含明文（R-04.9）。管理员不能查看用户登录密码。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonInput'}
      responses:
        '200':
          description: 接入明文
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessSecret'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin-api/subscriptions/{subscriptionId}/access-versions:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      operationId: adminListAccessVersions
      tags: [admin-subscriptions]
      summary: 接入版本历史（新的在前，不含密码）
      security: [{adminSession: []}]
      responses:
        '200':
          description: 接入版本
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AccessVersion'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin-api/subscriptions/{subscriptionId}/exit-bindings:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      operationId: adminListExitBindings
      tags: [admin-subscriptions]
      summary: 出口版本历史（新的在前）
      security: [{adminSession: []}]
      responses:
        '200':
          description: 出口绑定
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ExitBinding'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin-api/subscriptions/{subscriptionId}/exit-checks:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      operationId: adminCheckExit
      tags: [admin-subscriptions]
      summary: 手动检测当前出口
      description: 下发 exit_check 探测，异步完成；用 GET /admin-api/probes/{probeId} 查结果。检测流量不计入客户（R-05.5）。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已下发的探测
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Probe'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/Precondition'}
  /admin-api/subscriptions/{subscriptionId}/exit-candidates:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      operationId: adminCompareExitCandidate
      tags: [admin-subscriptions]
      summary: 换出口第二、三步：验证候选资源并与当前出口比较
      description: |
        流程：录入候选上游（POST /admin-api/upstreams）→ 本接口下发 candidate_compare 探测（验证认证与连通、取得实际出口）
        → 查探测结果中的 comparison（与当前出口不同、平台内独占、国家符合套餐）→ POST exit-changes 提交 → GET tasks/{taskId} 查结果。
        候选资源必须是 available 或 pending_verify 且不属于其他订阅。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExitCandidateInput'}
      responses:
        '202':
          description: 已下发的比较探测
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Probe'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/Precondition'}
  /admin-api/subscriptions/{subscriptionId}/exit-changes:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      operationId: adminSubmitExitChange
      tags: [admin-subscriptions]
      summary: 换出口第四步：提交换出口（可组合更换接入）
      description: |
        要求 compareProbeId 是该订阅、该资源最近一次已完成且三项比较均通过的探测（否则 412）；地址相同只能报告“上游已更新，出口未变”，
        不能提交（R-11.3）。alsoChangeAccess = true 为组合更换：新接入直接绑定新出口，任一步失败整体回到原状态（R-11.6）。
        关联 exitRequestId 时任务结束会自动更新申请状态。已有进行中任务时 409。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExitChangeInput'}
      responses:
        '200':
          description: 变更任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/Precondition'}
  /admin-api/subscriptions/{subscriptionId}/tasks:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      operationId: adminListSubscriptionTasks
      tags: [admin-subscriptions]
      summary: 变更任务历史（新的在前）
      security: [{adminSession: []}]
      responses:
        '200':
          description: 任务
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Task'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin-api/subscriptions/{subscriptionId}/ledger:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      operationId: adminListLedger
      tags: [admin-subscriptions]
      summary: 时长与流量账本（按时间正序）
      security: [{adminSession: []}]
      responses:
        '200':
          description: 账本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ledger'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin-api/subscriptions/{subscriptionId}/ledger-entries:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      operationId: adminCreateLedgerEntry
      tags: [admin-subscriptions]
      summary: 调整、赠送、补偿（独立账本条目）
      description: |
        只追加账本条目，不能覆盖余额或回退 used（R-08.8）。adjust 可正可负，gift / compensation 只能为正；
        扣回不能让合计为负（412）。补时（D-21）用 compensation + time。退款走订单退款流程，划转走 /admin-api/transfers。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LedgerEntryInput'}
      responses:
        '201':
          description: 新账本条目
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LedgerEntry'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/Precondition'}
        '422': {$ref: '#/components/responses/Invalid'}
  /admin-api/subscriptions/{subscriptionId}/events:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      operationId: adminListSubscriptionEvents
      tags: [admin-subscriptions]
      summary: 订阅时间线（含管理端内部条目，新的在前）
      security: [{adminSession: []}]
      responses:
        '200':
          description: 事件
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AdminSubscriptionEvent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin-api/subscriptions/{subscriptionId}/usage:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      operationId: adminGetSubscriptionUsage
      tags: [admin-subscriptions, admin-monitoring]
      summary: 流量与连接趋势
      description: |
        来源为节点上报的累计值差分，不作为扣量依据（R-19.2）。每个桶给出数据时间；没有样本的桶 bytes 为 null（断联或无数据），
        与真实零值区分。最长查询 90 天（D-07）。
      security: [{adminSession: []}]
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: bucket, in: query, schema: {type: string, enum: [5m, 1h, 1d], default: 1h}}
      responses:
        '200':
          description: 趋势
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageSeries'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /admin-api/transfers:
    post:
      operationId: adminTransferBalance
      tags: [admin-subscriptions]
      summary: 同用户订阅间全额划转剩余流量（R-10.6）
      description: 来源订阅剩余流量全额转入目标订阅，记为成对账本条目，来源余额归零并标注去向。两订阅必须属于同一用户（否则 412）。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
