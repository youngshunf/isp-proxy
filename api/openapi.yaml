      summary: 封禁（撤销会话并停用其全部订阅）
      description: 封禁不改变权益与期限；订阅阻断原因出现 account_banned，≤ 1 秒关闭全部连接（R-13.8）。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
