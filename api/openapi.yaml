  # ==========================================================================
  # 管理端：上游资源
  # ==========================================================================
  /admin-api/upstreams:
    get:
      operationId: adminListUpstreams
      tags: [admin-upstreams]
      summary: 上游资源列表
      security: [{adminSession: []}]
      parameters:
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: {$ref: '#/components/schemas/UpstreamStatus'}
        - {name: countryCode, in: query, schema: {type: string, pattern: '^[a-z]{2}$'}}
        - {name: city, in: query, schema: {type: string}}
        - {name: nodeId, in: query, schema: {type: string}}
        - {name: q, in: query, description: 按资源 ID、主机、供应商、出口 IP 搜索, schema: {type: string}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 一页资源
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpstreamPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: adminCreateUpstream
      tags: [admin-upstreams]
      summary: 录入上游资源
      description: |
        支持粘贴 url（socks5:// http:// https://，正确处理 URL 编码凭据、域名与 IPv6），也可逐字段录入；两者都给时以字段为准。
        录入后状态为 pending_verify，用 verify 下发验证，通过后进入 available（R-03.2）。同一协议+主机+端口+用户名重复录入返回 409。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpstreamInput'}
      responses:
        '201':
          description: 新资源
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upstream'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /admin-api/upstreams/{upstreamId}:
    parameters:
      - $ref: '#/components/parameters/UpstreamId'
    get:
      operationId: adminGetUpstream
      tags: [admin-upstreams]
      summary: 上游资源详情（不含密码明文）
      security: [{adminSession: []}]
      responses:
        '200':
          description: 资源
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upstream'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: adminUpdateUpstream
      tags: [admin-upstreams]
      summary: 修改上游资源
      description: |
        带 rowVersion 乐观锁，过期返回 409。修改连接信息（协议、主机、端口、凭据）会让资源回到 pending_verify；
        已占用（bound）的资源不能改连接信息（412），需走换出口。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpstreamPatch'}
      responses:
        '200':
          description: 资源
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upstream'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/Precondition'}
        '422': {$ref: '#/components/responses/Invalid'}
  /admin-api/upstreams/{upstreamId}/status:
    parameters:
      - $ref: '#/components/parameters/UpstreamId'
    post:
      operationId: adminSetUpstreamStatus
      tags: [admin-upstreams]
      summary: 人工改变库存状态（上架、隔离、停用）
      description: |
        允许的人工转换：pending_verify/cooldown/quarantine → available（要求最近一次验证通过）；任意非 bound → quarantine 或 retired。
        reserved、bound、cooldown 由订单、任务与调度维护，不能人工设入。已占用资源要先换出口。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpstreamStatusInput'}
      responses:
        '200':
          description: 资源
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upstream'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/Precondition'}
  /admin-api/upstreams/{upstreamId}/verify:
    parameters:
      - $ref: '#/components/parameters/UpstreamId'
    post:
      operationId: adminVerifyUpstream
      tags: [admin-upstreams]
      summary: 从所属节点验证上游（认证、连通、实际出口）
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已下发的验证探测
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Probe'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/Precondition'}

