  # ==========================================================================
  # 管理端：用户
  # ==========================================================================
  /admin-api/users:
    get:
      operationId: adminListUsers
      tags: [admin-users]
      summary: 用户列表
      security: [{adminSession: []}]
      parameters:
        - {name: q, in: query, description: 按邮箱或用户 ID 搜索, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [unverified, active, banned]}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 一页用户
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: adminCreateUser
      tags: [admin-users]
      summary: 代建用户（P0a）
      description: 只建邮箱，不设密码；系统给该邮箱发送设置密码的验证码，用户用 confirmPasswordReset 设置密码并完成验证（R-15.1）。邮箱已存在返回 409。
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequiredInput'}
      responses:
        '201':
          description: 新用户
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /admin-api/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: adminGetUser
      tags: [admin-users]
      summary: 用户详情（订阅与订单）
      security: [{adminSession: []}]
      responses:
        '200':
          description: 用户
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin-api/users/{userId}/ban:
